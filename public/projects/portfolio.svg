<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="softblur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Ambient glows -->
  <circle cx="650" cy="100" r="200" fill="#3b82f6" opacity="0.06" filter="url(#blur)"/>
  <circle cx="150" cy="400" r="180" fill="#6366f1" opacity="0.07" filter="url(#blur)"/>

  <!-- Grid lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="83" x2="800" y2="83"/>
    <line x1="0" y1="166" x2="800" y2="166"/>
    <line x1="0" y1="249" x2="800" y2="249"/>
    <line x1="0" y1="332" x2="800" y2="332"/>
    <line x1="0" y1="415" x2="800" y2="415"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Laptop body -->
  <rect x="200" y="100" width="400" height="260" rx="12" ry="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Screen bezel -->
  <rect x="214" y="114" width="372" height="232" rx="6" ry="6" fill="url(#screen)"/>

  <!-- Browser chrome bar -->
  <rect x="214" y="114" width="372" height="26" rx="6" ry="6" fill="#0f172a"/>
  <!-- Browser dots -->
  <circle cx="230" cy="127" r="4" fill="#ef4444" opacity="0.8"/>
  <circle cx="244" cy="127" r="4" fill="#f59e0b" opacity="0.8"/>
  <circle cx="258" cy="127" r="4" fill="#10b981" opacity="0.8"/>
  <!-- URL bar -->
  <rect x="280" y="120" width="200" height="14" rx="7" fill="#1e293b"/>
  <text x="380" y="130" font-family="monospace" font-size="7" fill="#64748b" text-anchor="middle">ujjwal-singh.netlify.app</text>

  <!-- Website content on screen -->
  <!-- Nav bar on site -->
  <rect x="214" y="140" width="372" height="24" fill="#0f172a" opacity="0.9"/>
  <text x="234" y="155" font-family="serif" font-size="10" fill="#3b82f6" font-style="italic">Ujjwal Singh</text>
  <rect x="440" y="147" width="30" height="6" rx="3" fill="#334155"/>
  <rect x="478" y="147" width="30" height="6" rx="3" fill="#334155"/>
  <rect x="516" y="147" width="30" height="6" rx="3" fill="#334155"/>
  <rect x="554" y="147" width="30" height="6" rx="3" fill="#334155"/>

  <!-- Hero section -->
  <rect x="214" y="164" width="372" height="182" fill="#0f172a"/>
  <!-- Hero text lines -->
  <rect x="234" y="182" width="90" height="10" rx="5" fill="#475569"/>
  <rect x="234" y="200" width="160" height="18" rx="4" fill="#1e40af"/>
  <rect x="234" y="226" width="130" height="8" rx="4" fill="#334155"/>
  <rect x="234" y="242" width="110" height="8" rx="4" fill="#334155"/>
  <!-- CTA buttons -->
  <rect x="234" y="260" width="70" height="20" rx="10" fill="url(#accent)"/>
  <rect x="314" y="260" width="70" height="20" rx="10" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Hero blob/illustration area -->
  <circle cx="520" cy="230" r="55" fill="#1e293b"/>
  <circle cx="520" cy="230" r="45" fill="#0f172a" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
  <text x="520" y="236" font-size="28" text-anchor="middle" fill="#3b82f6" opacity="0.7">💻</text>

  <!-- Glow under screen -->
  <rect x="214" y="340" width="372" height="14" fill="url(#glow)" filter="url(#softblur)"/>

  <!-- Laptop base / keyboard area -->
  <rect x="190" y="360" width="420" height="20" rx="6" ry="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <!-- Touchpad -->
  <rect x="355" y="365" width="90" height="10" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <!-- Keyboard dots row 1 -->
  <g fill="#334155" opacity="0.6">
    <rect x="210" y="364" width="8" height="4" rx="1"/>
    <rect x="222" y="364" width="8" height="4" rx="1"/>
    <rect x="234" y="364" width="8" height="4" rx="1"/>
    <rect x="246" y="364" width="8" height="4" rx="1"/>
    <rect x="258" y="364" width="8" height="4" rx="1"/>
    <rect x="270" y="364" width="8" height="4" rx="1"/>
    <rect x="282" y="364" width="8" height="4" rx="1"/>
    <rect x="294" y="364" width="8" height="4" rx="1"/>
    <rect x="306" y="364" width="8" height="4" rx="1"/>
    <rect x="318" y="364" width="8" height="4" rx="1"/>
    <rect x="330" y="364" width="8" height="4" rx="1"/>
    <rect x="342" y="364" width="8" height="4" rx="1"/>
  </g>

  <!-- Floating code snippets -->
  <!-- Left snippet -->
  <rect x="30" y="140" width="145" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.9"/>
  <text x="45" y="160" font-family="monospace" font-size="9" fill="#64748b">// React component</text>
  <text x="45" y="175" font-family="monospace" font-size="9" fill="#3b82f6">export default </text>
  <text x="45" y="190" font-family="monospace" font-size="9" fill="#e2e8f0">function </text>
  <text x="45" y="205" font-family="monospace" font-size="9" fill="#f59e0b">  Hero() {'{'}</text>

  <!-- Right snippet -->
  <rect x="625" y="200" width="145" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.9"/>
  <text x="640" y="220" font-family="monospace" font-size="9" fill="#64748b">// Framer Motion</text>
  <text x="640" y="235" font-family="monospace" font-size="9" fill="#3b82f6">&lt;motion.div</text>
  <text x="640" y="250" font-family="monospace" font-size="9" fill="#e2e8f0">  whileInView=</text>
  <text x="640" y="265" font-family="monospace" font-size="9" fill="#f59e0b">  {"{{opacity:1}}"}</text>

  <!-- Bottom snippet -->
  <rect x="280" y="420" width="240" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.85"/>
  <text x="300" y="440" font-family="monospace" font-size="9" fill="#64748b">// Tailwind CSS v4</text>
  <text x="300" y="456" font-family="monospace" font-size="9" fill="#3b82f6">className=</text>
  <text x="300" y="472" font-family="monospace" font-size="9" fill="#f59e0b">"bg-slate-900 py-20"</text>

  <!-- Tech pills -->
  <rect x="34" y="280" width="52" height="18" rx="9" fill="#1e40af" opacity="0.8"/>
  <text x="60" y="292" font-family="sans-serif" font-size="9" fill="#93c5fd" text-anchor="middle">React</text>

  <rect x="96" y="280" width="68" height="18" rx="9" fill="#065f46" opacity="0.8"/>
  <text x="130" y="292" font-family="sans-serif" font-size="9" fill="#6ee7b7" text-anchor="middle">Tailwind</text>

  <rect x="630" y="330" width="52" height="18" rx="9" fill="#4c1d95" opacity="0.8"/>
  <text x="656" y="342" font-family="sans-serif" font-size="9" fill="#c4b5fd" text-anchor="middle">Vite</text>

  <rect x="692" y="330" width="68" height="18" rx="9" fill="#1e3a5f" opacity="0.8"/>
  <text x="726" y="342" font-family="sans-serif" font-size="9" fill="#7dd3fc" text-anchor="middle">Netlify</text>

  <!-- Decorative dots -->
  <circle cx="60" cy="380" r="3" fill="#3b82f6" opacity="0.5"/>
  <circle cx="74" cy="380" r="3" fill="#6366f1" opacity="0.5"/>
  <circle cx="88" cy="380" r="3" fill="#8b5cf6" opacity="0.5"/>

  <circle cx="712" cy="160" r="3" fill="#3b82f6" opacity="0.5"/>
  <circle cx="726" cy="160" r="3" fill="#6366f1" opacity="0.5"/>
  <circle cx="740" cy="160" r="3" fill="#8b5cf6" opacity="0.5"/>
</svg>
